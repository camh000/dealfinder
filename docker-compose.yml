services:

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: dealfinder-web
    ports:
      - "5010:5000"   # host 5000 now belongs to Frigate
    env_file:
      - credentials.env
    # 'always' (not 'unless-stopped'): survives host reboots, engine updates
    # and manual stops - the outage went unnoticed for weeks because
    # unless-stopped deliberately never restarts a manually-stopped container.
    restart: always
    init: true
    # Reaches MariaDB on the Unraid host IP
    extra_hosts:
      - "host.docker.internal:host-gateway"

  scraper:
    build:
      context: .
      dockerfile: Dockerfile.scraper
    container_name: dealfinder-scraper
    env_file:
      - credentials.env
    environment:
      # Notification deep links open the app's deal page (market context,
      # max-bid advisor) instead of raw eBay. Override via a compose .env.
      APP_BASE_URL: ${APP_BASE_URL:-http://192.168.1.104:5010}
    restart: always
    init: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
